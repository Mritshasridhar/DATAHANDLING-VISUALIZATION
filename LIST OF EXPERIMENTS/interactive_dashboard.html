<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Sales & Operations Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f6f8; margin:0; padding:24px; color:#1f2937;}
  h1 { text-align:center; margin-bottom:4px; }
  p.sub { text-align:center; color:#6b7280; margin-top:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1200px; margin:20px auto; }
  .card { background:white; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  select { padding:6px 10px; border-radius:6px; border:1px solid #d1d5db; margin-bottom:10px; }
  .controls { text-align:center; margin-bottom:10px; }
  canvas { max-height:320px; }
</style>
</head>
<body>
<h1>Interactive Sales & Operations Dashboard</h1>
<p class="sub">Combines the line chart, bar chart, and product breakdown from Sets 1, 3 &amp; 11 into one interactive view</p>

<div class="controls">
  <label>Dataset: </label>
  <select id="datasetSelect">
    <option value="sales">Monthly Sales</option>
    <option value="employee">Employee Performance</option>
    <option value="inventory">Product Inventory</option>
    <option value="traffic">Website Traffic</option>
  </select>
</div>

<div class="grid">
  <div class="card"><canvas id="lineChart"></canvas></div>
  <div class="card"><canvas id="barChart"></canvas></div>
</div>

<script>
const data = {
  sales: {
    lineLabel: "Monthly Sales ($)",
    lineLabels: ["January","February","March","April","May"],
    lineData: [15000,18000,22000,20000,23000],
    barLabel: "Product Sales (Q1 total)",
    barLabels: ["Product A","Product B","Product C"],
    barData: [6600,4900,3700]
  },
  employee: {
    lineLabel: "Illustrative Performance Trend",
    lineLabels: ["Q1","Q2","Q3","Q4"],
    lineData: [85,87,89,90],
    barLabel: "Employees per Department",
    barLabels: ["Sales","HR","Marketing"],
    barData: [2,2,1]
  },
  inventory: {
    lineLabel: "N/A (static snapshot)",
    lineLabels: ["Product A","Product B","Product C","Product D","Product E"],
    lineData: [250,175,300,200,220],
    barLabel: "Quantity Available",
    barLabels: ["Product A","Product B","Product C","Product D","Product E"],
    barData: [250,175,300,200,220]
  },
  traffic: {
    lineLabel: "Daily Page Views",
    lineLabels: ["Jan 1","Jan 2","Jan 3","Jan 4","Jan 5"],
    lineData: [1500,1600,1400,1650,1800],
    barLabel: "Click-Through Rate (%)",
    barLabels: ["Jan 1","Jan 2","Jan 3","Jan 4","Jan 5"],
    barData: [2.3,2.7,2.0,2.4,2.6]
  }
};

let lineChart, barChart;

function render(key) {
  const d = data[key];
  const lctx = document.getElementById('lineChart').getContext('2d');
  const bctx = document.getElementById('barChart').getContext('2d');
  if (lineChart) lineChart.destroy();
  if (barChart) barChart.destroy();

  lineChart = new Chart(lctx, {
    type: 'line',
    data: { labels: d.lineLabels, datasets: [{ label: d.lineLabel, data: d.lineData,
      borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,0.15)', fill:true, tension:0.3 }] },
    options: { responsive:true, plugins:{ title:{ display:true, text:d.lineLabel } } }
  });

  barChart = new Chart(bctx, {
    type: 'bar',
    data: { labels: d.barLabels, datasets: [{ label: d.barLabel, data: d.barData,
      backgroundColor:['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed'] }] },
    options: { responsive:true, plugins:{ title:{ display:true, text:d.barLabel } } }
  });
}

document.getElementById('datasetSelect').addEventListener('change', e => render(e.target.value));
render('sales');
</script>
</body>
</html>
